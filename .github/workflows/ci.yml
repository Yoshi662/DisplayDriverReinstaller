name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore DisplayDriverReinstaller.slnx
      - name: Build
        run: dotnet build DisplayDriverReinstaller.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution DisplayDriverReinstaller.slnx --configuration Release --no-build
